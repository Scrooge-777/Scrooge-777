<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">SYSTEM MAINFRAME</title>
  <desc id="d">Animated banner: SYSTEM MAINFRAME with a scanning light line and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.55" stop-color="#0a1b2c"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .scan { animation: sweep 6s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .glow { animation: pulse 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scan, .cursor, .glow { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle class="glow" cx="1030" cy="40" r="170" fill="#7dd3fc" fill-opacity="0.07"/>
    <circle class="glow" cx="140" cy="240" r="150" fill="#fdba74" fill-opacity="0.06"/>
    <rect class="scan" x="0" y="0" width="260" height="260" fill="url(#scan)" opacity="0.5"/>
    <text class="mono" x="600" y="86" fill="#7dd3fc" fill-opacity="0.8" font-size="18" text-anchor="middle" letter-spacing="6">scrooge-777 // boot sequence</text>
    <text class="mono" x="600" y="158" fill="url(#ink)" font-size="68" font-weight="700" text-anchor="middle" textLength="920" lengthAdjust="spacingAndGlyphs">SYSTEM MAINFRAME</text>
    <rect class="cursor" x="1072" y="150" width="26" height="7" fill="#fdba74"/>
    <text class="mono" x="600" y="206" fill="#cbd5e1" fill-opacity="0.85" font-size="19" text-anchor="middle" letter-spacing="3">Rust · C# · Python — systems and tooling</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#7dd3fc" stroke-opacity="0.25"/>
</svg>
