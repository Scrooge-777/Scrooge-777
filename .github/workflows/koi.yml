name: Koi

on:
  schedule:
    # Every 2 hours & midnight IST (18:30 UTC): refresh live contributions, 3D terrain, and swimming koi
    - cron: "0 */2 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/koi.yml'
      - 'scripts/koi_scene.mjs'
      - 'scripts/koi_family.mjs'
      - 'scripts/build_koi_scene.mjs'
      - 'scripts/koi_strip.py'
      - 'koi/**'

permissions:
  contents: read

concurrency:
  group: profile-3d-sync
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo and the koi build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            koi/target
            card/rust/target
          key: ${{ runner.os }}-koi-${{ hashFiles('koi/Cargo.lock', 'koi/src/**', 'koi/examples/**', 'card/rust/Cargo.toml', 'card/rust/src/**') }}
          restore-keys: |
            ${{ runner.os }}-koi-

      - name: Build the vendored git-koi engine
        run: cargo build --release --manifest-path koi/Cargo.toml --bins --examples

      - name: Collect the account snapshot
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: koi/target/release/git-koi collect "${{ github.repository_owner }}" --output "$RUNNER_TEMP/snapshot.json"

      - name: Render the swimming koi at today's size
        run: |
          TOTAL=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).contribution_history.days;console.log(d.reduce((a,x)=>a+x.contribution_count,0))' "$RUNNER_TEMP/snapshot.json")
          echo "total contributions: $TOTAL"
          koi/target/release/examples/roam_sprites "$RUNNER_TEMP/snapshot.json" "$RUNNER_TEMP/sprites" asagi "$TOTAL"
          python -m pip install --quiet "pillow==12.2.0" "numpy==2.4.6"
          python scripts/koi_strip.py "$RUNNER_TEMP/sprites" "$TOTAL" "$RUNNER_TEMP/sprite.json"

      - name: Fetch Live Contribution Calendar and Update 3D Card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "${{ github.repository_owner }}") {
                contributionsCollection {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalIssueContributions
                  totalRepositoryContributions
                  restrictedContributionsCount
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        contributionLevel
                      }
                    }
                  }
                }
                repositories(first: 100, ownerAffiliations: OWNER) {
                  totalCount
                }
              }
            }
          ' > "$RUNNER_TEMP/calendar.json"
          cargo run --release --manifest-path card/rust/Cargo.toml -- docs/profile_card.svg docs/profile_card.svg --calendar "$RUNNER_TEMP/calendar.json"

      - name: Refresh the header (original capsule-render look, new colour each run)
        run: |
          URL='https://capsule-render.vercel.app/api?type=venom&color=auto&height=220&section=header&text=SYSTEM%20MAINFRAME&fontSize=38&fontColor=ffffff&animation=twinkling&fontAlignY=40'
          if curl -fsS --max-time 30 -o "$RUNNER_TEMP/header.svg" "$URL" && grep -q '<svg' "$RUNNER_TEMP/header.svg" && grep -q 'SYSTEM MAINFRAME' "$RUNNER_TEMP/header.svg" && ! grep -qiE '<script|onload|onerror|javascript:|<foreignObject' "$RUNNER_TEMP/header.svg"; then
            cp "$RUNNER_TEMP/header.svg" assets/header-venom.svg
          else
            echo "header fetch failed; keeping the last good copy"
          fi

      - name: Build the roaming-koi scene
        run: >
          node scripts/build_koi_scene.mjs
          --mode scene
          --snapshot "$RUNNER_TEMP/snapshot.json"
          --sprite "$RUNNER_TEMP/sprite.json"
          --header assets/header-venom.svg
          --card docs/profile_card.svg
          --out assets/scene.svg

      - name: Commit synchronized profile assets
        run: |
          git add assets/scene.svg assets/header-venom.svg docs/profile_card.svg assets/profile_card.svg
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: sync 3d activity terrain and swimming koi scene"
          git pull --rebase --autostash origin main
          git push --quiet
