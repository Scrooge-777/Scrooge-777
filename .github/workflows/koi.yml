name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/koi.yml'

permissions:
  contents: read

concurrency:
  group: profile-3d-sync
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Render Activity Koi (Self-Hosted)
        uses: ./koi
        with:
          body: asagi
          output-dir: koi

      - name: Mirror rendered koi to assets
        run: |
          cp koi/koi.gif assets/koi.gif

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif assets/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: redraw the day's activity koi"
          git pull --rebase --autostash origin main
          git push --quiet
