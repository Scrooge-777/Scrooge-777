name: Koi

on:
  schedule:
    # Every 5 hours (00, 05, 10, 15, 20 UTC): a new random route for the roaming koi.
    - cron: "0 */5 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/koi.yml'
      - 'scripts/koi_scene.mjs'
      - 'scripts/build_koi_scene.mjs'
      - 'scripts/koi_strip.py'
      - 'koi/**'

permissions:
  contents: read

concurrency:
  group: profile-3d-sync
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo and the koi build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            koi/target
          key: ${{ runner.os }}-koi-${{ hashFiles('koi/Cargo.lock', 'koi/src/**', 'koi/examples/**') }}
          restore-keys: |
            ${{ runner.os }}-koi-

      - name: Build the vendored git-koi engine
        run: cargo build --release --manifest-path koi/Cargo.toml --bins --examples

      - name: Collect the account snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: koi/target/release/git-koi collect "${{ github.repository_owner }}" --output "$RUNNER_TEMP/snapshot.json"

      - name: Render the swimming koi at today's size
        run: |
          TOTAL=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).contribution_history.days;console.log(d.reduce((a,x)=>a+x.contribution_count,0))' "$RUNNER_TEMP/snapshot.json")
          echo "total contributions: $TOTAL"
          koi/target/release/examples/roam_sprites "$RUNNER_TEMP/snapshot.json" "$RUNNER_TEMP/sprites" asagi "$TOTAL"
          python -m pip install --quiet "pillow==12.2.0" "numpy==2.4.6"
          python scripts/koi_strip.py "$RUNNER_TEMP/sprites" "$TOTAL" "$RUNNER_TEMP/sprite.json"

      - name: Put the koi into the activity card (new random route)
        run: |
          cp "$RUNNER_TEMP/sprite.json" assets/koi-sprite.json
          # assets/profile_card.svg stays the plain card from the Profile card sync workflow;
          # docs/profile_card.svg is the same card with the roaming koi, which the Vercel
          # endpoint behind README card.svg fetches and re-colours on every refresh.
          node scripts/build_koi_scene.mjs --mode card --renew             --sprite assets/koi-sprite.json             --state assets/koi-state.json             --card assets/profile_card.svg             --out docs/profile_card.svg

      - name: Commit the card if it changed
        run: |
          git add assets/koi-sprite.json assets/koi-state.json docs/profile_card.svg
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: new random route"
          git pull --rebase --autostash origin main
          git push --quiet
