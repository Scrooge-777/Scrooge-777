name: Profile

# One pipeline for the picture at the top of the README (assets/scene.svg):
#   live GitHub data -> activity card -> koi family -> scene -> commit.
# It fails loudly if the data looks wrong, and then the last good picture simply stays online.

on:
  schedule:
    - cron: "0 */2 * * *"    # every 2 hours
    - cron: "30 18 * * *"    # and at midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - ".github/engine/**"
      - ".github/vendor/**"
      - ".github/rules/**"
  pull_request:          # a branch is tested before it is merged; the picture is only built on main
    paths:
      - ".github/workflows/profile.yml"
      - ".github/engine/**"
      - ".github/vendor/**"
      - ".github/rules/**"

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

env:
  # Contribution days are counted in this time zone. Without it GitHub counts in UTC, and
  # an evening in India would be missing from the card until the next UTC day.
  PROFILE_TZ: Asia/Kolkata

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .github/engine/target
            .github/vendor/git-koi/target
          key: ${{ runner.os }}-nyx-${{ hashFiles('.github/engine/Cargo.lock', '.github/vendor/git-koi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nyx-

      - name: Engine tests (card data, card layout, koi family, life, scene, rule sheets, repository)
        run: cargo test --locked --manifest-path .github/engine/Cargo.toml --quiet
      - name: Koi engine tests
        run: cargo test --manifest-path .github/vendor/git-koi/Cargo.toml --quiet

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .github/engine/target
          key: ${{ runner.os }}-nyx-build-${{ hashFiles('.github/engine/Cargo.lock', '.github/vendor/git-koi/Cargo.lock', '.github/engine/src/**', '.github/vendor/git-koi/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nyx-build-

      - name: Build the picture (live data -> card -> koi family -> scene)
        env:
          # PROFILE_TOKEN is a personal token that can also see private contributions;
          # the default token only sees public ones.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then echo "::warning::PROFILE_TOKEN is not set: private contributions are not counted"; fi
          cargo run --locked --release --manifest-path .github/engine/Cargo.toml -- build --login "${{ github.repository_owner }}" --out assets/scene.svg

      - name: Commit the picture if it changed
        run: |
          git add assets/scene.svg
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "profile: refresh live card and koi"
          git pull --rebase --autostash origin main
          git push --quiet
