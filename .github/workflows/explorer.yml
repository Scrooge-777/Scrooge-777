name: Capture Bitcoin explorer evidence

on:
  push:
    branches: [certverify-explorer]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - run: python explorer/capture.py
      - name: Publish
        run: |
          mkdir -p /tmp/t && cp -r explorer/out /tmp/t/ && cd /tmp/t
          git init -q -b explorer-out && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Explorer evidence" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" explorer-out
