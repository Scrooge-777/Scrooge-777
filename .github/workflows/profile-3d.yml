name: Profile card sync

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 2 hours
    - cron: "30 18 * * *"   # Midnight IST (12:00 AM)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'api/**'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

concurrency:
  group: profile-3d-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: false

      - name: Sync profile card & README arsenal
        run: |
          python bin/generate-card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate scripts and SVG asset
        run: |
          python -m py_compile bin/*.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('docs/profile_card.svg'); ET.parse('assets/profile_card.svg')"

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/profile_card.svg assets/profile_card.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update 3d contribution terrain, radar, and language metrics"
            git pull --rebase --autostash origin main
            git push
          fi
