name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 18 * * *"   # Midnight IST (12:00 AM)
    - cron: "0 0,6,12 * * *"  # Every 6 hours UTC (18:00 slot omitted: 18:30 run covers it)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Patch Multi-Language Breakdown & Relocate to Assets
        run: |
          python scripts/patch_3d_languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Sync Interactive GitHub Card v2 & README Arsenal
        run: |
          python scripts/sync_github_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate scripts and SVG assets
        run: |
          python -m py_compile scripts/*.py
          python -c "import glob, xml.etree.ElementTree as ET; [ET.parse(f) for f in glob.glob('assets/*.svg')]"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch profile-3d-contrib || true
          git add assets/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update 3d contribution graph, interactive card, and arsenal"
            git pull --rebase --autostash origin main
            git push
          fi
