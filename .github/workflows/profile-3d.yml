name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Patch Multi-Language Breakdown & Relocate to Assets
        run: |
          python scripts/patch_3d_languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Sync Interactive GitHub Card v2
        run: |
          python scripts/sync_github_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch profile-3d-contrib || true
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update 3d contribution graph and interactive card assets"
            git pull --rebase --autostash origin main
            git push
          fi
