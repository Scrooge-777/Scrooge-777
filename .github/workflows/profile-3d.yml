name: Profile card sync

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 2 hours (catches high runner delay & frequent work)
    - cron: "30 18 * * *"   # Midnight IST (12:00 AM)
  workflow_dispatch:
  repository_dispatch:
    types: [sync-card, post-push]
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: sync-profile-card
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync profile card & README arsenal
        run: |
          python scripts/sync_github_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate scripts and SVG assets
        run: |
          python -m py_compile scripts/*.py
          python -c "import glob, xml.etree.ElementTree as ET; [ET.parse(f) for f in glob.glob('assets/*.svg')]"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update 3d contribution graph, interactive card, and arsenal"
            git pull --rebase --autostash origin main
            git push
          fi
