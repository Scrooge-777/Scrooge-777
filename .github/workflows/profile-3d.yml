name: Profile card sync

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 2 hours
    - cron: "30 18 * * *"   # Midnight IST (12:00 AM)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'card/rust/**'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: read

concurrency:
  group: profile-3d-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            card/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('card/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch Live GitHub Contribution Calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "${{ github.repository_owner }}") {
                contributionsCollection {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalIssueContributions
                  totalRepositoryContributions
                  restrictedContributionsCount
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        contributionLevel
                      }
                    }
                  }
                }
                repositories(first: 100, ownerAffiliations: OWNER) {
                  totalCount
                }
              }
            }
          ' > calendar.json

      - name: Build & Run 3D Card Generator (Rust Edition)
        run: |
          cargo run --release --manifest-path card/rust/Cargo.toml -- docs/profile_card.svg docs/profile_card.svg --calendar calendar.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/profile_card.svg assets/profile_card.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update 3d contribution terrain, radar, and language metrics"
            git pull --rebase --autostash origin main
            git push
            gh workflow run koi.yml --ref main || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
