<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-title card-desc" width="1280" height="850" viewBox="0 0 1280 850">
<title id="card-title">GitHub activity card for @user@</title>
<desc id="card-desc">Isometric terrain of the last 12 weeks of contributions, a contribution-mix radar, top languages, and totals for contributions, commits, pull requests, repos, stars and forks.</desc>
<defs>
<radialGradient id="bg" cx="25%" cy="15%" r="95%"><stop offset="0" stop-color="#11151c"/><stop offset="0.55" stop-color="#0b0e13"/><stop offset="1" stop-color="#030406"/></radialGradient>
<linearGradient id="radarFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0" stop-opacity="0.32"/><stop offset="1" stop-color="#e2e8f0" stop-opacity="0.05"/></linearGradient>
<linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<style>*{font-family:"Inter","Ubuntu","Helvetica","Arial",sans-serif}
.fg{fill:#eeeeff}.weak{fill:#9aa0b8}.strong{fill:#e2e8f0}
.card{fill:#ffffff;fill-opacity:0.025;stroke:#ffffff;stroke-opacity:0.08;stroke-width:1;transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
.card:hover{fill-opacity:0.07;stroke:#30363d;stroke-opacity:0.6;filter:url(#soft)}
.c0t{fill:#1b1f28}.c0l{fill:#151820}.c0r{fill:#101319}
.c1t{fill:#394254}.c1l{fill:#2d3443}.c1r{fill:#232934}
.c2t{fill:#58657d}.c2l{fill:#465063}.c2r{fill:#363e4d}
.c3t{fill:#94a3b8}.c3l{fill:#64748b}.c3r{fill:#475569}
.c4t{fill:#e2e8f0}.c4l{fill:#cbd5e1}.c4r{fill:#94a3b8}

/* Mouse Interactivity */
.iso-col{cursor:pointer;transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1),filter 0.22s ease}
.iso-col:hover{transform:scale(1.22) translateY(-8px);filter:drop-shadow(0 0 12px #e2e8f0)}

.donut-slice{cursor:pointer;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),filter 0.3s ease;transform-origin:150px 665px}
.donut-slice:hover{transform:scale(1.08);filter:drop-shadow(0 0 14px currentColor)}

.lang-row{cursor:pointer;transition:transform 0.2s ease,opacity 0.2s ease}
.lang-row:hover{transform:translateX(5px);opacity:1}

.radar-node{cursor:pointer;transition:r 0.25s ease}
.radar-node:hover{r:7}

.kpi-pill{cursor:pointer;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1),stroke 0.25s ease,fill-opacity 0.25s ease}
.kpi-pill:hover{transform:translateY(-4px);fill-opacity:0.08;stroke:#e2e8f0;stroke-width:1.5;stroke-opacity:0.8}
/* Autonomous 3D Continuous Movement */
.terrain-3d { animation: levitate3D 6s ease-in-out infinite alternate; transform-origin: 380px 320px; }
@keyframes levitate3D {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(-0.3deg); }
  100% { transform: translateY(-13px) rotate(0.2deg); }
}

.donut-dial { animation: dialFloat 6s ease-in-out infinite alternate; transform-origin: 150px 663px; }
@keyframes dialFloat {
  0% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.025) rotate(1.2deg); }
  100% { transform: scale(1) rotate(-0.8deg); }
}

</style>
<rect width="1280" height="850" fill="none"/>
<text x="40" y="68" font-size="18" font-weight="700" fill="#ffffff">Last 12 weeks</text>
<text x="40" y="102" font-size="12" class="weak">Less</text>
<rect x="74" y="91" width="14" height="14" rx="3" class="c0t"/>
<rect x="92" y="91" width="14" height="14" rx="3" class="c1t"/>
<rect x="110" y="91" width="14" height="14" rx="3" class="c2t"/>
<rect x="128" y="91" width="14" height="14" rx="3" class="c3t"/>
<rect x="146" y="91" width="14" height="14" rx="3" class="c4t"/>
<text x="168" y="102" font-size="12" class="weak">More</text>
<!--@terrain-->
<rect x="780" y="96" width="470" height="380" rx="20" class="card" filter="url(#soft)"/>
<text x="804" y="128" font-size="16" font-weight="700" class="fg">Contribution mix</text>
<polygon points="1015.0,284.0 1039.7,302.0 1030.3,331.0 999.7,331.0 990.3,302.0" fill="none" stroke="#9aa0b8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<polygon points="1015.0,258.0 1064.5,293.9 1045.6,352.1 984.4,352.1 965.5,293.9" fill="none" stroke="#9aa0b8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<polygon points="1015.0,232.0 1089.2,285.9 1060.8,373.1 969.2,373.1 940.8,285.9" fill="none" stroke="#9aa0b8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<polygon points="1015.0,206.0 1113.9,277.9 1076.1,394.1 953.9,394.1 916.1,277.9" fill="none" stroke="#9aa0b8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<polygon points="1015.0,180.0 1138.6,269.8 1091.4,415.2 938.6,415.2 891.4,269.8" fill="none" stroke="#9aa0b8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<line x1="1015" y1="310" x2="1015.0" y2="180.0" stroke="#9aa0b8" stroke-opacity="0.25"/>
<line x1="1015" y1="310" x2="1138.6" y2="269.8" stroke="#9aa0b8" stroke-opacity="0.25"/>
<line x1="1015" y1="310" x2="1091.4" y2="415.2" stroke="#9aa0b8" stroke-opacity="0.25"/>
<line x1="1015" y1="310" x2="938.6" y2="415.2" stroke="#9aa0b8" stroke-opacity="0.25"/>
<line x1="1015" y1="310" x2="891.4" y2="269.8" stroke="#9aa0b8" stroke-opacity="0.25"/>
<!--@radar-->
<text x="54" y="552" font-size="16" font-weight="700" class="fg">Top languages</text>
<!--@languages-->
<!--@pills-->
</svg>