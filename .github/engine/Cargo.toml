[package]
name = "nyx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Builds the profile picture: live activity card, koi family and the final scene."
publish = false

[lib]
name = "nyx"
path = "src/lib.rs"

[[bin]]
name = "nyx"
path = "src/main.rs"

[dependencies]
git-koi = { path = "../vendor/git-koi" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
png = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
